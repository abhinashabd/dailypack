<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGradFooter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#E64A19" />
    </linearGradient>
    <linearGradient id="goldGradFooter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#E09315" />
    </linearGradient>
  </defs>

  <!-- Transparent Canvas -->
  <rect width="600" height="600" fill="transparent" />

  <!-- Packaging Graphic Group -->
  <g transform="translate(100, 30)">
    <!-- Back Items inside box -->
    <!-- Plate -->
    <ellipse cx="200" cy="140" rx="60" ry="45" fill="none" stroke="#FFFFFF" stroke-width="6" />
    <ellipse cx="200" cy="140" rx="45" ry="32" fill="none" stroke="#FFFFFF" stroke-width="4" />

    <!-- Coffee Cup -->
    <g transform="translate(90, 100)">
      <!-- Lid -->
      <path d="M 0,25 L 45,25 L 42,15 C 40,10 35,10 35,10 L 10,10 C 10,10 5,10 3,15 Z" fill="#FFFFFF" />
      <!-- Cup Body -->
      <path d="M 4,28 L 41,28 L 36,80 L 9,80 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" />
      <line x1="7" y1="45" x2="38" y2="45" stroke="#FFFFFF" stroke-width="3" />
    </g>

    <!-- Clamshell Box -->
    <g transform="translate(150, 130)">
      <!-- Lid -->
      <path d="M 10,35 L 90,35 L 85,15 C 80,10 75,10 50,10 C 25,10 20,10 15,15 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" />
      <!-- Base -->
      <path d="M 5,35 L 95,35 L 85,60 L 15,60 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" />
    </g>

    <!-- Cutlery (Fork, Knife, Spoon) -->
    <!-- Fork -->
    <g transform="translate(255, 90)">
      <path d="M 5,0 L 5,30 M 12,0 L 12,30 M 19,0 L 19,30" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
      <path d="M 3,25 Q 12,40 21,25 L 12,40 L 12,90" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
    </g>

    <!-- Knife -->
    <g transform="translate(285, 95)">
      <path d="M 5,0 C 15,15 15,35 5,45 L 5,90" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Spoon -->
    <g transform="translate(305, 110)">
      <ellipse cx="10" cy="18" rx="8" ry="16" fill="none" stroke="#FFFFFF" stroke-width="4" />
      <path d="M 10,34 L 10,85" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Main Cardboard Box Base -->
    <!-- Front Left Face -->
    <path d="M 50,200 L 200,270 L 200,340 L 50,270 Z" fill="#1E293B" stroke="#FFFFFF" stroke-width="2" />
    <!-- Front Right Face -->
    <path d="M 200,270 L 350,200 L 350,270 L 200,340 Z" fill="#0F172A" stroke="#FFFFFF" stroke-width="2" />

    <!-- Open Box Top Flaps (Orange) -->
    <!-- Left Top Flap -->
    <path d="M 50,200 L 0,150 L 130,120 L 200,270 Z" fill="url(#orangeGradFooter)" />
    <!-- Right Top Flap -->
    <path d="M 350,200 L 400,150 L 270,120 L 200,270 Z" fill="url(#orangeGradFooter)" />
    <!-- Front Left Flap Fold -->
    <path d="M 50,200 L 200,270 L 140,220 L 0,150 Z" fill="#F26522" opacity="0.95" />
    <!-- Front Right Flap Fold -->
    <path d="M 350,200 L 200,270 L 260,220 L 400,150 Z" fill="#E64A19" opacity="0.95" />
  </g>

  <!-- Typography Group -->
  <g transform="translate(300, 420)" text-anchor="middle">
    <!-- DAILY PACK Title -->
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="62" letter-spacing="2">
      <tspan fill="#FFFFFF">DAILY</tspan>
      <tspan fill="#F5A623">PACK</tspan>
    </text>

    <!-- Subtitle with lines -->
    <g transform="translate(0, 30)">
      <line x1="-240" y1="-8" x2="-140" y2="-8" stroke="#F5A623" stroke-width="2" />
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#E2E8F0" letter-spacing="6">SOLUTION PVT LTD</text>
      <line x1="140" y1="-8" x2="240" y2="-8" stroke="#F5A623" stroke-width="2" />
    </g>

    <!-- Tagline -->
    <text x="0" y="75" font-family="Georgia, serif" font-style="italic" font-weight="500" font-size="24" fill="#94A3B8">
      Your perfect food packaging partner
    </text>
  </g>
</svg>
