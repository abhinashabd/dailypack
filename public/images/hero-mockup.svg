<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Soft Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.1" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="kraftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7B587" />
      <stop offset="100%" stop-color="#BE9763" />
    </linearGradient>
    <linearGradient id="greenPouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D4F43" />
      <stop offset="100%" stop-color="#1B362C" />
    </linearGradient>
    <linearGradient id="darkBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E382B" />
      <stop offset="100%" stop-color="#12251B" />
    </linearGradient>
    <linearGradient id="amberJarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="pedestalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E0D8" />
      <stop offset="100%" stop-color="#D3CDC3" />
    </linearGradient>
    <linearGradient id="orangeLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#E64A19" />
    </linearGradient>
  </defs>

  <!-- Studio Floor & Pedestal -->
  <g transform="translate(0, 0)">
    <!-- Terrazzo Pedestal block -->
    <rect x="580" y="380" width="220" height="140" rx="8" fill="url(#pedestalGrad)" filter="url(#softShadow)" />
    <!-- Pedestal Top Surface shadow -->
    <path d="M 580,380 L 800,380 L 800,390 L 580,390 Z" fill="#C5BFB5" opacity="0.6" />
  </g>

  <!-- 1. Kraft Paper Standup Pouch (Left Back) -->
  <g transform="translate(520, 20)" filter="url(#dropShadow)">
    <!-- Pouch Body -->
    <path d="M 15,40 C 15,40 180,40 180,40 C 190,40 195,50 190,70 L 175,410 C 170,425 155,430 95,430 C 35,430 20,425 15,410 L 0,70 C -5,50 5,40 15,40 Z" fill="url(#kraftGrad)" />
    <!-- Zipper Top Seal Notch -->
    <path d="M 10,40 L 185,40 L 182,10 C 182,5 178,0 170,0 L 25,0 C 17,0 13,5 13,10 Z" fill="#B38B57" />
    <line x1="15" y1="22" x2="180" y2="22" stroke="#967140" stroke-width="2" stroke-dasharray="4,3" />

    <!-- Text on Kraft Pouch -->
    <text x="95" y="140" font-family="'Georgia', serif" font-weight="700" font-size="28" fill="#1E293B" text-anchor="middle">
      <tspan x="95" dy="0">Good</tspan>
      <tspan x="95" dy="32">Packaging</tspan>
      <tspan x="95" dy="32">Builds</tspan>
      <tspan x="95" dy="36" fill="#0F172A">Great Brands.</tspan>
    </text>

    <!-- DailyPack Logo on Pouch -->
    <g transform="translate(60, 310)">
      <path d="M0,0 L12,-12 L24,0 L12,12 Z" fill="#F26522" />
      <path d="M12,-12 L24,-24 L36,-12 L24,0 Z" fill="#1E293B" />
      <text x="42" y="-2" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#1E293B">DailyPack</text>
    </g>
  </g>

  <!-- 2. Dark Green Pouch (Right Back) -->
  <g transform="translate(670, 70)" filter="url(#dropShadow)">
    <path d="M 12,35 L 158,35 C 165,35 170,45 166,60 L 150,370 C 146,382 135,385 85,385 C 35,385 24,382 20,370 L 4,60 C 0,45 5,35 12,35 Z" fill="url(#greenPouchGrad)" />
    <path d="M 8,35 L 162,35 L 160,8 C 160,4 156,0 150,0 L 20,0 C 14,0 10,4 10,8 Z" fill="#152B23" />

    <text x="85" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="24" fill="#E2E8F0" text-anchor="middle">
      <tspan x="85" dy="0">Sustain.</tspan>
      <tspan x="85" dy="30">Package.</tspan>
      <tspan x="85" dy="30">Repeat.</tspan>
    </text>

    <g transform="translate(50, 270)">
      <path d="M0,0 L10,-10 L20,0 L10,10 Z" fill="#F26522" />
      <path d="M10,-10 L20,-20 L30,-10 L20,0 Z" fill="#64748B" />
      <text x="35" y="-2" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#E2E8F0">DailyPack</text>
    </g>
  </g>

  <!-- 3. Dark Green Box (Foreground Left) -->
  <g transform="translate(470, 360)" filter="url(#dropShadow)">
    <!-- Top Face -->
    <path d="M 0,40 L 140,0 L 250,40 L 110,80 Z" fill="#294B3C" />
    <!-- Front Face -->
    <path d="M 0,40 L 110,80 L 110,230 L 0,190 Z" fill="url(#darkBoxGrad)" />
    <!-- Right Face -->
    <path d="M 110,80 L 250,40 L 250,190 L 110,230 Z" fill="#102118" />

    <!-- Text on Front Face -->
    <text x="20" y="110" font-family="'Georgia', serif" font-weight="700" font-size="20" fill="#E2E8F0">
      <tspan x="20" dy="0">Designed</tspan>
      <tspan x="20" dy="24" font-weight="400" font-size="17" fill="#A7F3D0">for what's next.</tspan>
    </text>

    <g transform="translate(20, 175)">
      <path d="M0,0 L8,-8 L16,0 L8,8 Z" fill="#F26522" />
      <text x="22" y="3" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#E2E8F0">DailyPack</text>
    </g>
  </g>

  <!-- 4. Amber Glass Jar (Foreground Center on Pedestal) -->
  <g transform="translate(635, 270)" filter="url(#dropShadow)">
    <!-- Black Lid -->
    <rect x="10" y="0" width="100" height="35" rx="4" fill="#1E293B" />
    <!-- Glass Jar Body -->
    <rect x="5" y="32" width="110" height="130" rx="16" fill="url(#amberJarGrad)" />

    <!-- Label -->
    <rect x="15" y="55" width="90" height="85" rx="4" fill="#F59E0B" />
    <text x="60" y="85" font-family="'Georgia', serif" font-weight="700" font-size="16" fill="#78350F" text-anchor="middle">
      <tspan x="60" dy="0">Pure</tspan>
      <tspan x="60" dy="20">By Nature</tspan>
    </text>
    <text x="60" y="126" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#451A03" text-anchor="middle">DailyPack</text>
  </g>

  <!-- 5. Paper Box "Ideas Inside" (Foreground Right) -->
  <g transform="translate(720, 290)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="120" height="230" rx="8" fill="#FFFDF9" stroke="#E2E8F0" stroke-width="2" />
    <!-- Botanical pattern background design -->
    <path d="M 0,130 Q 60,100 120,160 L 120,230 L 0,230 Z" fill="#E6EFE9" />
    <path d="M 20,150 Q 50,110 90,170" stroke="#34D399" stroke-width="3" fill="none" opacity="0.6" />

    <text x="20" y="50" font-family="'Georgia', serif" font-weight="700" font-size="22" fill="#0F172A">
      <tspan x="20" dy="0">Ideas</tspan>
      <tspan x="20" dy="26">Inside</tspan>
    </text>

    <g transform="translate(20, 110)">
      <path d="M0,0 L6,-6 L12,0 L6,6 Z" fill="#F26522" />
      <text x="18" y="2" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#0F172A">DailyPack</text>
    </g>
  </g>

  <!-- 6. Sticker Label Roll (Far Right) -->
  <g transform="translate(800, 350)" filter="url(#dropShadow)">
    <ellipse cx="50" cy="80" rx="45" ry="80" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="3" />
    <path d="M 50,0 L 100,20 L 100,140 L 50,160 Z" fill="#FFFDF9" stroke="#E2E8F0" stroke-width="2" />

    <text x="75" y="60" font-family="'Georgia', serif" font-weight="700" font-size="12" fill="#0F172A" text-anchor="middle">
      <tspan x="75" dy="0">Small</tspan>
      <tspan x="75" dy="14">Details.</tspan>
      <tspan x="75" dy="14">Big Impact.</tspan>
    </text>
  </g>
</svg>
